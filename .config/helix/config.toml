[editor]
clipboard-provider = "pasteboard"   # macOS clipboard
auto-completion = true              # aktifkan auto-complete popup
auto-format = true                  # format otomatis saat :w (save)
line-number = "relative"
mouse = true
true-color = true
scrolloff = 8                       # kursor tetap di tengah saat scroll
cursorline = true                   # highlight baris kursor
color-modes = true                  # warna cursor berubah sesuai mode
end-of-line-diagnostics = "hint"    # teks singkat di ujung baris, tidak panjang

[editor.cursor-shape]
insert = "bar"                      # cursor garis tipis saat INSERT (seperti VS Code)
normal = "block"
select = "underline"

[editor.indent-guides]
render = true                       # tampilkan garis indent

[editor.lsp]
display-messages = false            # sembunyikan progress LSP ("indexing...", dll)
display-progress-messages = false   # sembunyikan loading bar LSP
display-inlay-hints = true

[editor.inline-diagnostics]
cursor-line = "warning"             # error/warning hanya muncul di baris kursor
other-lines = "disable"             # baris lain bersih total

# ---------- INSERT MODE ----------
[keys.insert]
C-space = "completion"
A-s = "signature_help"

# ---------- NORMAL MODE ----------
[keys.normal]
C-c = "yank_to_clipboard"
C-a = ["select_all"]               # ⚠️ override default increment number (C-a)
C-S-down = ["extend_to_line_bounds", "yank", "paste_after", "collapse_selection"]
C-S-up   = ["extend_to_line_bounds", "yank", "paste_before", "collapse_selection"]
D = ["extend_to_line_bounds", "delete_selection"]
C-D = ["extend_to_line_bounds", "yank_to_clipboard", "delete_selection"]
# comment
"C-/" = ["toggle_comments"]
# Save & Quit
C-s = [":w"]
C-q = [":q!"]
# Format manual
F = [":format"]
# ✅ q dihapus dari :q — pakai C-q atau ZQ agar macro recording tetap bisa dipakai

# ---------- SELECT MODE ----------
[keys.select]
C-c = "yank_to_clipboard"
C-a = ["select_all"]
"C-S-down" = ["extend_to_line_bounds", "yank", "paste_after", "collapse_selection"]
"C-S-up"   = ["extend_to_line_bounds", "yank", "paste_before", "collapse_selection"]
C-s = [":w"]
