
# ---------- Appearance ----------
font_family            JetBrainsMono Nerd Font
#bold_font              auto
italic_font            auto
bold_italic_font       auto
font_size              10.0

# macOS option/alt works for terminal apps (Helix, yazi, etc.)
macos_option_as_alt    both

# Padding & cursor
window_padding_width   8
cursor_shape           block
cursor_blink_interval  0

# Subtle transparency (0 = opaque)
background_opacity     0.96

# Quiet
enable_audio_bell      no
confirm_os_window_close 0

# Scrollback
scrollback_lines       10000

# Tabs
tab_bar_edge           top
tab_bar_style          powerline

# ---------- Colors (simple dark) ----------
foreground             #d8dee9
background             #1e1e2e
selection_foreground   #1e1e2e
selection_background   #a6adc8

color0  #45475a
color8  #585b70
color1  #f38ba8
color9  #f38ba8
color2  #a6e3a1
color10 #a6e3a1
color3  #f9e2af
color11 #f9e2af
color4  #89b4fa
color12 #89b4fa
color5  #cba6f7
color13 #cba6f7
color6  #94e2d5
color14 #94e2d5
color7  #bac2de
color15 #cdd6f4

# ---------- Quality of life ----------
# Allow Alt-based shortcuts in CLI tools (already set via macos_option_as_alt).
# Avoid accidentally pausing terminal with Ctrl+S (handled in fish via stty -ixon)

# ---------- Keybindings ----------
# New window / splits
map ctrl+shift+enter      launch --cwd=current
map ctrl+shift+d          launch --cwd=current --location=hsplit
map ctrl+shift+backslash  launch --cwd=current --location=vsplit

# Close / focus splits
map ctrl+shift+w          close_window
map ctrl+shift+left       neighboring_window left
map ctrl+shift+right      neighboring_window right
map ctrl+shift+up         neighboring_window up
map ctrl+shift+down       neighboring_window down

# Tabs
map ctrl+shift+t          new_tab
map ctrl+shift+pgup       previous_tab
map ctrl+shift+pgdown     next_tab
map ctrl+shift+q          close_tab

# Font size
map ctrl+=                change_font_size all +1.0
map ctrl+-                change_font_size all -1.0
map ctrl+0                change_font_size all 0

#YAZI
map ctrl+shift+y launch --cwd=current /opt/homebrew/bin/fish -c "yazi"

# Kirim CSI 1;6A/B untuk Ctrl+Shift+Arrow
map ctrl+shift+up   send_text all \x1b[1;6A
map ctrl+shift+down send_text all \x1b[1;6B

# --- OPTIONAL: jika ingin Cmd-C/V kirim Ctrl-C/V ke app (mis. Helix) ---
# Hati-hati: ini akan override copy/paste native terminal.
# map cmd+c send_text all \x03   # Ctrl-C
# map cmd+v send_text all \x16   # Ctrl-V
allow_remote_control yes
listen_on unix:/tmp/kitty
listen_on unix:/tmp/kitty
env KITTY_LISTEN_ON=unix:/tmp/kitty-{kitty_pid}
