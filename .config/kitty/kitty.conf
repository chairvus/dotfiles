# ---------- Appearance ----------
font_family            JetBrainsMono Nerd Font Mono
bold_font              auto
italic_font            auto
bold_italic_font       auto
font_size              12.0
text_rendering_engine  coretext

macos_option_as_alt    both

window_padding_width   8
cursor_shape           block
cursor_blink_interval  -1

background_opacity     0.96

enable_audio_bell      no
confirm_os_window_close 0
scrollback_lines       10000

tab_bar_edge           top
tab_bar_style          powerline

# ---------- Colors (Purple Dark) ----------
foreground             #cdd6f4
background             #1a1025

selection_foreground   #1a1025
selection_background   #c9a0ff

# Cursor
cursor                 #c9a0ff
cursor_text_color      #1a1025

# URL
url_color              #a78bfa

# Blacks
color0  #2d1f42
color8  #4a3566

# Reds
color1  #f38ba8
color9  #f38ba8

# Greens
color2  #a6e3a1
color10 #a6e3a1

# Yellows
color3  #f9e2af
color11 #f9e2af

# Blues → digeser ke purple
color4  #b39ddb
color12 #ce93d8

# Magentas (purple pekat)
color5  #c9a0ff
color13 #e0b0ff

# Cyans → lavender
color6  #b0c4ff
color14 #cbb8ff

# Whites
color7  #d0bfff
color15 #ede7ff

# Tab bar
active_tab_foreground   #1a1025
active_tab_background   #c9a0ff
inactive_tab_foreground #9370db
inactive_tab_background #2d1f42

# ---------- Remote control ----------
allow_remote_control   yes
listen_on              unix:/tmp/kitty-{kitty_pid}
env KITTY_LISTEN_ON=unix:/tmp/kitty-{kitty_pid}

# ---------- Keybindings ----------
map ctrl+shift+enter      launch --cwd=current
map ctrl+shift+d          launch --cwd=current --location=hsplit
map ctrl+shift+backslash  launch --cwd=current --location=vsplit
map ctrl+shift+w          close_window

# Window navigation (Cmd agar tidak konflik dengan CSI keys)
map cmd+left              neighboring_window left
map cmd+right             neighboring_window right
map cmd+up                neighboring_window up
map cmd+down              neighboring_window down

# Tabs
map ctrl+shift+t          new_tab
map ctrl+shift+pgup       previous_tab
map ctrl+shift+pgdown     next_tab
map ctrl+shift+q          close_tab

# Font size
map ctrl+=                change_font_size all +1.0
map ctrl+-                change_font_size all -1.0
map ctrl+0                change_font_size all 0

# Yazi
map ctrl+shift+y          launch --cwd=current /opt/homebrew/bin/fish -c "yazi"

# CSI sequences untuk Helix
map ctrl+shift+up         send_text all \x1b[1;6A
map ctrl+shift+down       send_text all \x1b[1;6B
