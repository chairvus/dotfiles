"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

# =========================
# Manager
# =========================
[mgr]
ratio          = [2, 4, 3]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
linemode       = "none"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
mouse_events   = ["click", "scroll"]
title_format   = "Yazi: {cwd}"

# =========================
# Preview
# =========================
[preview]
wrap            = "no"
tab_size        = 2
max_width       = 1200
max_height      = 1000
image_delay     = 30
image_filter    = "triangle"
image_quality   = 75
ueberzug_scale  = 1
ueberzug_offset = [0, 0, 0, 0]

# =========================
# OPENER (INI KUNCI 🔥)
# =========================
[opener]
edit = [
  { run = "/opt/homebrew/bin/hx %s", desc = "Helix", for = "unix", block = true }
]


# PLAY
play = [
  { run = "open %s", desc = "Play", for = "macos" },
]

# OPEN (non-text)
open = [
  { run = "open %s", desc = "Open", for = "macos" },
]

# REVEAL
reveal = [
  { run = "open -R %s", desc = "Reveal", for = "macos" },
]

extract = [
  { run = "ya pub extract --list %s", desc = "Extract here" }
]

download = [
  { run = "ya emit download --open %S", desc = "Download and open" },
  { run = "ya emit download %S", desc = "Download" }
]

# =========================
# OPEN RULES
# =========================
[open]
rules = [
  # Folder
  { url = "*/", use = ["edit", "open", "reveal"] },

  # Text → HELIX (o & e)
  { mime = "text/*", use = ["edit", "reveal"] },

  # JSON / Code
  { mime = "application/{json,ndjson}", use = ["edit", "reveal"] },
  { mime = "*/javascript", use = ["edit", "reveal"] },

  # Image
  { mime = "image/*", use = ["open", "reveal"] },

  # Media
  { mime = "{audio,video}/*", use = ["play", "reveal"] },

  # Archive
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma}", use = ["extract", "reveal"] },

  # Empty file
  { mime = "inode/empty", use = ["edit", "reveal"] },

  # Fallback
  { url = "*", use = ["open", "reveal"] }
]

# =========================
# Tasks
# =========================
[tasks]
micro_workers = 10
macro_workers = 10

# =========================
# Input
# =========================
[input]
cursor_blink = false

# =========================
# Confirm dialogs
# =========================
[confirm]
trash_title = "Trash selected files?"
delete_title = "Delete permanently?"
